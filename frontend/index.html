<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>두더지 잡기</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-green-100 flex flex-col items-center py-8 select-none">
  <h1 class="text-3xl font-bold text-green-900 mb-4">🔨 두더지 잡기</h1>

  <!-- 점수판 -->
  <div class="flex gap-6 mb-4 text-lg font-semibold text-green-900">
    <div>점수: <span id="scoreText">0</span></div>
    <div>남은 시간: <span id="timeText">30</span>초</div>
    <div>최고 점수: <span id="bestText">0</span></div>
  </div>

  <!-- 두더지 구멍 (JS에서 9개 생성) -->
  <div id="board" class="grid grid-cols-3 gap-4 mb-6"></div>

  <button id="startButton" class="px-6 py-2 rounded-lg bg-green-600 text-white font-bold hover:bg-green-700 active:scale-95">
    게임 시작
  </button>
  <p id="messageText" class="mt-4 text-green-900 font-medium h-6"></p>

  <script src="app.js"></script>
</body>
</html>
